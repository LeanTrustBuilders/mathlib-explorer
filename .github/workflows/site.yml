name: Site

# Builds the Mathlib Explorer for Mathlib's newest release tag (v4.x.y, v4.x.y-rcN) that trust-extract
# has a release for, and publishes it. The dataset (S2) of that commit is extracted by the extractor's
# action, with the examples and attributes facets, and kept as the release mathlib-dataset-<commit12>
# of this repository, so that a rebuild of the site (after a change to it) does not extract again.
on:
  schedule:
    - cron: '20 3 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: A Mathlib tag or commit (default the newest tag trust-extract supports)
        required: false
      replace:
        description: Extract again and replace the published dataset
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['mathlib_explorer/**', 'pyproject.toml', '.github/workflows/site.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The toolchains trust-extract has a release for
        id: extractor
        uses: LeanTrustBuilders/extractor/setup@main
        with:
          toolchain: ''
      - name: Which Mathlib
        env:
          SUPPORTED: ${{ steps.extractor.outputs.toolchains }}
          REF: ${{ inputs.ref }}
        run: |
          if [ -z "$REF" ]; then
            # The newest release tag whose Lean version has a trust-extract release.
            REF=$(git ls-remote --tags --refs https://github.com/leanprover-community/mathlib4 'v4.*' | sed 's|.*refs/tags/||' |
              sort -V -r | while read -r t; do if tr ' ' '\n' <<< "$SUPPORTED" | grep -qxF "${t#v}"; then echo "$t"; break; fi; done)
          fi
          [ -n "$REF" ] || { echo "::error::no Mathlib tag on a toolchain trust-extract supports ($SUPPORTED)"; exit 1; }
          git clone -q --filter=blob:none https://github.com/leanprover-community/mathlib4 "$RUNNER_TEMP/mathlib"
          git -C "$RUNNER_TEMP/mathlib" checkout -q "$REF"
          commit=$(git -C "$RUNNER_TEMP/mathlib" rev-parse HEAD)
          echo "Mathlib $REF = $commit, $(cat "$RUNNER_TEMP/mathlib/lean-toolchain")"
          { echo "REF=$REF"; echo "COMMIT=$commit"; echo "TAG=mathlib-dataset-${commit:0:12}"; } >> "$GITHUB_ENV"
      - name: mathlib-explorer, evidence-core and evidence-store
        run: pip install -q . "git+https://github.com/LeanTrustBuilders/evidence-store@main"
      - run: python3 -m unittest discover -s tests
      - name: The published dataset, if there is one
        id: published
        run: |
          if [ "${{ inputs.replace }}" != "true" ] && evidence-store dataset --repo "$GITHUB_REPOSITORY" --tag 'mathlib-dataset-{commit12}' \
              --commit "$COMMIT" --out "$RUNNER_TEMP/dataset" > /dev/null 2>&1; then
            echo "dataset=$RUNNER_TEMP/dataset" >> "$GITHUB_OUTPUT"
          fi
      - name: Room on the runner
        if: steps.published.outputs.dataset == ''
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Lean, and Mathlib from its cache
        if: steps.published.outputs.dataset == ''
        working-directory: ${{ runner.temp }}/mathlib
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"; echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake exe cache get
          lake build --no-build Mathlib > /dev/null
      - name: Extract and publish
        id: extract
        if: steps.published.outputs.dataset == ''
        uses: LeanTrustBuilders/extractor/extract@main
        with:
          root: Mathlib
          repo: leanprover-community/mathlib4
          directory: ${{ runner.temp }}/mathlib
          args: --parts 12 --jobs 1
          publish: ${{ env.TAG }}
          replace: ${{ inputs.replace || 'false' }}
          title: Mathlib ${{ env.REF }}
      - name: Build the site
        run: |
          dataset="${{ steps.published.outputs.dataset || steps.extract.outputs.dataset }}"
          mathlib-explorer build --dataset "$dataset" --mathlib "$RUNNER_TEMP/mathlib" --out _site
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
