<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathlib Explorer</title>
<meta name="description" content="Discover and understand Mathlib, the library of formalized mathematics of the Lean proof assistant: its subjects, concepts and theorems, what each is built from and how each is proved.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>∮</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/"><span class="brand-mark">∮</span> Mathlib Explorer</a>
    <form class="search" id="search-form" role="search">
      <input id="q" type="search" placeholder="Search: a concept, a theorem, a subject…" autocomplete="off" spellcheck="false" aria-label="Search Mathlib">
    </form>
    <nav class="nav" aria-label="Sections">
      <a href="#/subjects">Subjects</a><a href="#/famous">Famous theorems</a><a href="#/curriculum">Curriculum</a><a href="#/books">Books</a><a href="#/map">Map</a><a href="#/about">About</a>
    </nav>
    <button class="theme" id="theme" aria-label="Switch between light and dark">◐</button>
  </div>
</header>
<main id="main" tabindex="-1"><p class="loading">Loading Mathlib…</p></main>
<div id="tip" class="tip" role="tooltip" hidden></div>
<footer class="foot" id="foot"></footer>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<script src="app.js"></script>
</body>
</html>
